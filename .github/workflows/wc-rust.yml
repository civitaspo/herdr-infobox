name: Rust and release policy (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: "2026.9.15"
          install_args: "--locked"
          cache: false
      - name: Check Rust formatting and lints
        run: mise run lint:rust
      - name: Test release policy, Rust, UI, and bridge
        run: mise run test
      - name: Build Rust
        run: mise run build

[tools]
rust = { version = "1.98.1", components = ["clippy", "rustfmt"] }
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "5.0.0"

[tasks.lint]
description = "Check workflow security, action pins, shell scripts, and Rust"
depends = ["lint:rust"]
run = [
  "shellcheck scripts/*.sh tests/fixtures/*.sh",
  "ghalint run",
  "pinact run --check --verify-comment",
]

[tasks."lint:rust"]
description = "Check release versions, Rust formatting, and Clippy"
run = [
  "bash scripts/sync-version.sh --check",
  "rustfmt --edition 2024 --check scripts/sync-version.rs",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
]

[tasks.test]
description = "Test release policy and Rust integrations"
run = [
  "bash scripts/sync-version.sh --check",
  "bash scripts/test-release-policy.sh",
  """
set -eu
target=$(rustc -vV | sed -n 's/^host: //p')
test -n "$target"
cargo test --workspace --all-features --locked --target "$target" --target-dir target
""",
]

[tasks.build]
description = "Check release versions and build the Rust executable"
run = [
  "bash scripts/sync-version.sh --check",
  "cargo build --workspace --locked",
]

[tasks.benchmark]
description = "Measure synthetic collector process latency and persistence"
run = """
set -eu
target=$(rustc -vV | sed -n 's/^host: //p')
test -n "$target"
cargo build --locked --target "$target" --target-dir target
cargo run --locked --target "$target" --target-dir target --example benchmark_collector -- "target/$target/debug/herdr-infobox"
"""

[tools]
rust = { version = "1.98.1", components = ["clippy", "rustfmt"] }
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "5.0.0"

[tasks.lint]
description = "Check workflow security, action pins, shell scripts, and Rust when present"
run = [
  "shellcheck scripts/*.sh",
  "ghalint run",
  "pinact run --check --verify-comment",
  "disable-checkout-persist-credentials",
  "git diff --exit-code -- .github/workflows",
  "bash scripts/check-rust.sh lint",
]

[tasks.test]
description = "Verify release bump policy and run Rust tests when present"
run = ["bash scripts/test-release-policy.sh", "bash scripts/check-rust.sh test"]

[tasks.build]
description = "Build the Rust package when present"
run = "bash scripts/check-rust.sh build"

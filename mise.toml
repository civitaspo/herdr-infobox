[tools]
node = "22.22.2"
python = "3.13.12"
rust = { version = "1.98.1", components = ["clippy", "rustfmt"] }
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "5.0.0"

[tasks.lint]
description = "Check workflow security, action pins, shell scripts, and Rust"
depends = ["lint:rust"]
run = [
  "shellcheck scripts/*.sh",
  "ghalint run",
  "pinact run --check --verify-comment",
]

[tasks."lint:rust"]
description = "Check release versions, Rust formatting, and Clippy"
run = [
  "python3 scripts/sync-version.py --check",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
]

[tasks.test]
description = "Test release policy, Rust, terminal UI, and OpenCode bridge"
run = [
  "python3 scripts/sync-version.py --check",
  "bash scripts/test-release-policy.sh",
  "python3 scripts/test-version-sync.py",
  """
set -eu
target=$(rustc -vV | sed -n 's/^host: //p')
test -n "$target"
cargo test --workspace --all-features --locked --target "$target" --target-dir target
python3 scripts/test-ui-runtime.py "target/$target/debug/herdr-infobox"
node adapters/opencode/test.mjs
node adapters/opencode/integration.mjs "target/$target/debug/herdr-infobox"
""",
]

[tasks.build]
description = "Check release versions and build the Rust executable"
run = [
  "python3 scripts/sync-version.py --check",
  "cargo build --workspace --locked",
]

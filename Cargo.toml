[package]
name = "herdr-infobox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Session repositories, references, plans, and local diffs for Herdr"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
turso = { version = "=0.8.1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

toml = { version = "1.1.4", default-features = false, features = ["parse", "std", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"
rustix = { version = "=1.1.5", features = ["fs", "pty", "termios"] }
